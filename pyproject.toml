[project]
name = "diy-model"
version = "0.1.0"
description = "Ollama 本地聊天＋RAG（Qdrant）新手教學專案"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "ollama==0.6.2",
  "ddgs==9.16.0",
  "qdrant-client==1.19.0",
]

[project.optional-dependencies]
pdf = ["pypdf"]
docx = ["python-docx==1.2.0"]
ocr = ["Pillow==12.3.0", "pytesseract"]
rerank = ["sentence-transformers==6.0.1"]
tokens = ["tiktoken"]
cli = ["prompt_toolkit"]
dev = ["pytest==9.1.1", "ruff", "pyright"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["__pycache__", ".pytest_cache", "notes"]

# P13：只攔真 bug（E/F），風格類（B/UP/SIM/W）暫不強制，避免大重構。
# E402 豁免：try/except 降級匯入故意放中段；BROAD_EXCEPT_OK 僅為註解記號，不影響 ruff。
[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["F401", "F841"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
reportMissingImports = false
reportUnknownMemberType = false
reportUnknownVariableType = false
# P13：測試不隨貨，只檢查主程式
exclude = ["tests", "notes", "__pycache__", ".pytest_cache"]
